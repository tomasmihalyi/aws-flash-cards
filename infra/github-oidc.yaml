AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Actions OIDC trust plus the two roles the refresh plane needs.
  No access keys are created and nothing long-lived is stored in GitHub.

# WHY TWO ROLES AND NOT ONE
#
# src/lib/aws.ts already carries a six-pair read-only allow-list, and that is good
# hygiene — but it is CLIENT-side: it constrains code that chooses to call through
# it. IAM is the control that actually binds. So the roles mirror the allow-list
# rather than being broader "because it's only reads".
#
# The split is not decoration. The refresher has no reason to touch the bucket and
# the publisher has no reason to read SSM, so neither is granted the other's
# rights. "Ingest cannot write to AWS" becomes a property of the role.
#
# Both roles also carry an explicit Deny on the other's actions. An Allow attached
# elsewhere — a future managed policy, a permissions boundary someone loosens —
# cannot override an explicit Deny.

Parameters:
  GitHubOwner:
    Type: String
    Default: tomasmihalyi
  GitHubRepo:
    Type: String
    Default: aws-flash-cards
  GitHubOwnerId:
    Type: String
    Default: '20979055'
    Description: >
      Numeric owner id. Part of GitHub's IMMUTABLE subject claim — see the note
      below. Obtain with: gh api repos/OWNER/REPO --jq .owner.id

      Changing the OWNER of the repository changes this id and therefore changes
      the subject. Migrating from tomyister (34014084) to tomasmihalyi (20979055)
      required this stack to be updated in the same sitting as the transfer —
      a repository transfer is silent as far as IAM is concerned, and the only
      symptom is every assume-role failing afterwards.
  GitHubRepoId:
    Type: String
    Default: '1329366635'
    Description: >
      Numeric repository id. Obtain with: gh api repos/OWNER/REPO --jq .id
  GitHubRef:
    Type: String
    Default: refs/heads/main
    Description: >
      Only this ref may assume these roles. Scoping to a ref, not just the repo,
      means a branch pushed by anyone cannot assume a role that writes the
      published deck.
  DeckBucketName:
    Type: String
    Description: Bucket from the FlashcardsReadPlane stack output.
  DraftModelId:
    Type: String
    Default: 'au.anthropic.claude-sonnet-4-5-20250929-v1:0'
    Description: >
      The ONE inference profile Tier B may invoke. Scoped in the DraftRole policy
      so a compromised workflow cannot reach another model in the account — models
      differ in data-handling terms, and that matters more than the inference bill.
  DraftFoundationModel:
    Type: String
    Default: 'anthropic.claude-sonnet-4-5-*'
    Description: >
      The underlying foundation model, which must ALSO be granted. A cross-region
      inference profile invokes the foundation model in whichever region serves the
      request, so a policy naming only the profile fails with an AccessDenied that
      names the foundation-model ARN instead. Granting just the profile looks
      correct and is not.
  DistributionId:
    Type: String
    Description: Distribution from the FlashcardsReadPlane stack output.
  CreateOIDCProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >
      An account may hold only ONE provider per URL. Verified empty at authoring
      time, so the default creates it — set false if another stack has since taken
      ownership, otherwise this stack fails on a duplicate.

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOIDCProvider, 'true']

# THE SUBJECT CLAIM IS NOT WHAT MOST DOCUMENTATION SAYS
#
# Nearly every GitHub-OIDC example writes the subject as:
#
#   repo:OWNER/REPO:ref:refs/heads/main
#
# This repository is issued an IMMUTABLE subject instead, with numeric ids
# embedded:
#
#   repo:OWNER@<ownerId>/REPO@<repoId>:ref:refs/heads/main
#
# The first deploy used the documented form and every assume-role failed with
# "Not authorized to perform sts:AssumeRoleWithWebIdentity" — a message that says
# nothing about which claim mismatched, and which is indistinguishable from a
# wrong audience, a missing provider, or a wrong account. What actually settled it
# was asking GitHub what it sends:
#
#   gh api repos/OWNER/REPO/actions/oidc/customization/sub
#   -> {"use_default":true,"sub_claim_prefix":"repo:tomasmihalyi@20979055/aws-flash-cards@1329366635"}
#
# Read that endpoint before debugging a trust policy; it is the only place the
# real prefix is visible without decoding a token you cannot see.
#
# This form is STRICTER, not merely different, and that is why it is embraced here
# rather than worked around: numeric ids are immutable, so deleting this repo and
# recreating one with the same name produces a DIFFERENT subject and cannot assume
# these roles. The name-based form would have kept trusting the impostor.

Resources:

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS validates GitHub's certificate chain against its own trust store, so
      # these are required by the resource schema rather than load-bearing. Both
      # of GitHub's published intermediates are listed so a rotation to either
      # does not require a stack update.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fdd

  # ------------------------------------------------------------- refresher ----
  RefreshRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: flashcards-refresh
      Description: Reads the three credentialed sources. Cannot touch the bucket.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                # StringEquals, not StringLike: an exact subject. A wildcard here
                # is the classic OIDC misconfiguration that lets any branch — and
                # in the `repo:*` form, any repository — assume the role.
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:${GitHubRef}'
      Policies:
        - PolicyName: read-the-three-sources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SsmGlobalInfrastructureOnly
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                # PUBLIC AWS PARAMETERS HAVE NO ACCOUNT ID IN THEIR ARN.
                #
                # The global-infrastructure tree is owned by AWS, not by the
                # caller, so the real resource is:
                #
                #   arn:aws:ssm:us-east-1::parameter/aws/service/global-infrastructure/...
                #                        ^^ empty account field
                #
                # The first version of this policy scoped to
                # arn:aws:ssm:*:<account>:parameter/aws/service/... which cannot
                # match, and every read failed with AccessDeniedException naming
                # ssm:GetParametersByPath.
                #
                # This survived a twelve-case policy simulation because the
                # simulation was fed the ARN written HERE rather than the ARN the
                # API actually uses — a tautology that confirms the policy matches
                # itself. When simulating, take the resource ARN from an error
                # message or from the service's documentation, never from the
                # policy under test.
                #
                # Both forms are granted: the AWS-owned form is the one in use, and
                # the account-owned form covers a same-path parameter in this
                # account. The path scope is what constrains this, not the account.
                Resource:
                  - !Sub 'arn:aws:ssm:*::parameter/aws/service/global-infrastructure/*'
                  - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/aws/service/global-infrastructure/*'
              - Sid: PriceListIsPublicAndHasNoResourceArns
                Effect: Allow
                Action:
                  - pricing:GetProducts
                  - pricing:DescribeServices
                # The Price List API does not support resource-level permissions.
                # Recorded rather than silently written as '*': the wildcard is the
                # API's limitation, not a decision to grant broadly.
                Resource: '*'
              - Sid: ServiceQuotasReadOnly
                Effect: Allow
                Action:
                  - servicequotas:ListServiceQuotas
                  - servicequotas:ListAWSDefaultServiceQuotas
                  - servicequotas:GetServiceQuota
                Resource: '*'
              - Sid: CallerIdentityForTheRunLog
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'
              - Sid: NeverWriteAnythingNorReadTheDeck
                Effect: Deny
                Action:
                  - s3:*
                  - cloudfront:*
                  - iam:*
                  - bedrock:*
                  - secretsmanager:*
                  # The increase-request operation is what turns a quota read into
                  # a quota WRITE. Denied explicitly even though nothing calls it.
                  - servicequotas:RequestServiceQuotaIncrease
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource: '*'

  # ------------------------------------------------------------- publisher ----
  PublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: flashcards-publish
      Description: Writes the deck bucket and invalidates one distribution. Reads no sources.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:${GitHubRef}'
      Policies:
        - PolicyName: publish-the-deck
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteObjectsInTheOneBucket
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${DeckBucketName}/*'
              - Sid: ListTheOneBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${DeckBucketName}'
              - Sid: InvalidateTheOneDistribution
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'
              - Sid: NeverReadASourceNorChangeTheBucketItself
                Effect: Deny
                Action:
                  - ssm:*
                  - pricing:*
                  - servicequotas:*
                  - iam:*
                  - secretsmanager:*
                  # Writing objects is the job. Changing the bucket's policy,
                  # encryption, versioning or public-access blocks is not, and that
                  # is the difference between publishing and taking the origin
                  # public by accident.
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketAcl
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketVersioning
                  - s3:DeleteBucket
                Resource: '*'

  # ------------------------------------------------------------------ draft ----
  # TIER B. A SEPARATE ROLE, NOT A WIDENING OF THE REFRESHER.
  #
  # The refresh role's guarantee is "ingest cannot write to AWS", and its policy is
  # six read operations that mirror src/lib/aws.ts. Model inference is not a write,
  # but it is not a read of a published source either: it costs money per call and
  # it is the one operation in this system whose output cannot be trusted on
  # arrival. Adding bedrock:InvokeModel to the refresher would quietly change what
  # "the refresh role" means, and the daily unattended job would carry a spend
  # capability it never needs.
  #
  # So Tier B gets its own role. The refresher keeps its Deny on bedrock:*, which
  # means the nightly job CANNOT reach a model even if a future code path tries.
  DraftRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: flashcards-draft
      Description: Invokes ONE model for Tier B prose drafting. Cannot read a source or write the bucket.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:${GitHubRef}'
      Policies:
        - PolicyName: invoke-one-model
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeTheDraftingModelOnly
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                # Scoped to the inference profile and its underlying foundation
                # models. A wildcard here would let a compromised workflow run any
                # model in the account, including ones with different data-handling
                # terms — the cost of that is not the inference bill.
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${DraftModelId}'
                  - !Sub 'arn:aws:bedrock:*::foundation-model/${DraftFoundationModel}'
              - Sid: ListModelsToFailFastRatherThanMidRun
                Effect: Allow
                Action: bedrock:ListFoundationModels
                Resource: '*'
              - Sid: CallerIdentityForTheRunLog
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'
              - Sid: NeverReadASourceNorTouchTheDeck
                Effect: Deny
                Action:
                  # Tier B is handed its evidence by the refresher's output in the
                  # repository. It has no business fetching a source itself: if it
                  # could, "the model only saw retained excerpts" would stop being
                  # a property and become a hope.
                  - ssm:*
                  - pricing:*
                  - servicequotas:*
                  - s3:*
                  - cloudfront:*
                  - iam:*
                  - secretsmanager:*
                  - bedrock:CreateModelCustomizationJob
                  - bedrock:PutModelInvocationLoggingConfiguration
                Resource: '*'

Outputs:
  RefreshRoleArn:
    Description: Set as the repository variable AWS_REFRESH_ROLE_ARN.
    Value: !GetAtt RefreshRole.Arn
  PublishRoleArn:
    Description: Set as the repository variable AWS_PUBLISH_ROLE_ARN.
    Value: !GetAtt PublishRole.Arn
  DraftRoleArn:
    Description: Set as the repository variable AWS_DRAFT_ROLE_ARN. Tier B only.
    Value: !GetAtt DraftRole.Arn
