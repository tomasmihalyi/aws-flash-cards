<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS AI-Native Development Field Deck — @@COUNT@@ Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F7;
  --card:#FFFFFF;
  --ink:#0E1B2C;
  --slate:#55637A;
  --line:#D4DCE8;
  --blue:#1F5EFF;
  --blue-soft:#E8EEFF;
  --amber:#B36B00;
  --amber-soft:#FFF3DC;
  --mint:#0B7A54;
  --mint-soft:#E2F5EC;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 90px}

/* ---------- header ---------- */
header{margin-bottom:14px}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600}
h1{font-family:var(--disp);font-weight:700;font-size:1.65rem;line-height:1.15;margin:.2rem 0 .3rem}
.sub{color:var(--slate);font-size:.86rem;max-width:46ch}
.meta{font-family:var(--mono);font-size:.66rem;color:var(--slate);margin-top:.5rem;display:flex;gap:.9rem;flex-wrap:wrap}
.meta b{color:var(--ink)}

/* ---------- filters ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-family:var(--mono);font-size:.7rem;font-weight:500;white-space:nowrap;border:1px solid var(--line);
  background:var(--card);color:var(--slate);border-radius:3px;padding:7px 12px;cursor:pointer;transition:all .15s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- search ---------- */
.search{position:relative;margin:10px 0 2px}
.search input{width:100%;font-family:var(--mono);font-size:.78rem;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:3px;padding:10px 34px 10px 12px}
.search input::placeholder{color:var(--slate)}
.search input:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--slate);font-size:1rem;line-height:1;cursor:pointer;padding:6px 8px;border-radius:3px}
.search .clear:hover{color:var(--ink)}
.search .clear:focus-visible{outline:2px solid var(--blue)}
.search .clear[hidden]{display:none}

/* ---------- tags ---------- */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.tag{font-family:var(--mono);font-size:.64rem;border:1px solid var(--line);background:var(--card);
  color:var(--slate);border-radius:999px;padding:4px 9px;cursor:pointer;transition:all .12s}
.tag:hover{border-color:var(--blue);color:var(--blue)}
.tag.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:600}
.tag:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tag i{font-style:normal;opacity:.55;margin-left:.35em}
.tagsMore{font-family:var(--mono);font-size:.64rem;color:var(--blue);background:none;border:0;
  cursor:pointer;padding:4px 6px;text-decoration:underline}
.tagsMore:focus-visible{outline:2px solid var(--blue)}

/* ---------- study mode ---------- */
.studyBar{display:flex;align-items:center;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.studyToggle{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.05em;
  border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:3px;
  padding:8px 12px;cursor:pointer}
.studyToggle[aria-pressed="true"]{background:var(--ink);color:#fff}
.studyToggle:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.studyStats{font-family:var(--mono);font-size:.64rem;color:var(--slate);display:flex;gap:.75rem;flex-wrap:wrap}
.studyStats b{color:var(--ink)}
.studyStats .chg{color:var(--amber);font-weight:600}
.studyDone{background:var(--mint-soft);border-left:2px solid var(--mint);color:var(--mint);
  font-family:var(--mono);font-size:.7rem;padding:10px 12px;border-radius:0 3px 3px 0;margin:10px 0}

/* the "this changed since you studied it" flag */
.changed{background:var(--amber-soft);border-left:2px solid var(--amber);padding:8px 10px;
  border-radius:0 3px 3px 0;font-family:var(--mono);font-size:.62rem;color:var(--amber);
  margin:0 0 10px;line-height:1.5}
.changed b{display:block;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}

/* grade buttons — only shown on the back face in study mode */
.grades{display:flex;gap:6px;margin-top:12px;border-top:1px dashed var(--line);padding-top:11px}
.grades button{flex:1;font-family:var(--mono);font-size:.64rem;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;border:1px solid var(--line);background:var(--card);color:var(--slate);
  border-radius:3px;padding:9px 2px;cursor:pointer;transition:all .12s}
.grades button:hover{border-color:var(--ink);color:var(--ink)}
.grades button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.grades button i{display:block;font-style:normal;font-size:.56rem;opacity:.6;margin-top:2px;text-transform:none}
.grades .g0:hover{border-color:var(--amber);color:var(--amber)}
.grades .g5:hover{border-color:var(--mint);color:var(--mint)}
.sched{font-family:var(--mono);font-size:.6rem;color:var(--slate);margin-top:9px}

/* ---------- progress ---------- */
.progress{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.count{font-family:var(--mono);font-size:.7rem;color:var(--slate);min-width:64px;text-align:right}

/* ---------- card ---------- */
.stage{perspective:1600px;min-height:520px}
.cardShell{position:relative;width:100%;min-height:520px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.cardShell.flipped{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){
  .cardShell{transition:none}
  .bar i{transition:none}
}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 1px 2px rgba(14,27,44,.05),0 10px 28px rgba(14,27,44,.08);
  display:flex;flex-direction:column;overflow:hidden}
.back{transform:rotateY(180deg)}

/* datasheet header strip */
.strip{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 16px;font-family:var(--mono);font-size:.64rem;letter-spacing:.08em}
.partno{color:var(--blue);font-weight:600}
.badge{padding:2px 8px;border-radius:2px;font-weight:600;text-transform:uppercase}
.badge.ga{background:var(--mint-soft);color:var(--mint)}
.badge.pv{background:var(--amber-soft);color:var(--amber)}
.badge.core{background:var(--blue-soft);color:var(--blue)}

/* front */
.front .art{display:flex;justify-content:center;padding:26px 0 8px}
.front .art svg{width:150px;height:150px}
.front h2{font-family:var(--disp);font-weight:700;font-size:1.5rem;text-align:center;padding:4px 20px 0;line-height:1.2}
.front .hook{color:var(--slate);text-align:center;font-size:.88rem;padding:8px 26px 0;max-width:44ch;margin:0 auto}
.front .tap{margin-top:auto;text-align:center;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--slate);padding:16px;text-transform:uppercase}
.front .tap::before{content:"";display:block;width:26px;height:1px;background:var(--line);margin:0 auto 10px}

/* back */
.back .body{padding:16px 18px 18px;overflow-y:auto;font-size:.85rem}
.back h3{font-family:var(--disp);font-size:1.05rem;margin-bottom:8px}
.back p{margin-bottom:10px;color:#22314A}
.kv{border-top:1px dashed var(--line);margin-top:4px;padding-top:10px}
.kv .row{display:flex;gap:10px;margin-bottom:8px}
.kv .k{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);min-width:86px;padding-top:2px;font-weight:600}
.kv .v{flex:1;color:#22314A}
.hookline{background:var(--blue-soft);border-left:2px solid var(--blue);padding:8px 10px;border-radius:0 3px 3px 0;font-size:.8rem;margin-top:6px}
.hookline b{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);display:block;margin-bottom:2px}

/* provenance footer — the source and verification date, visible to the learner */
.prov{border-top:1px dashed var(--line);margin-top:12px;padding-top:9px;display:flex;flex-direction:column;gap:4px;
  font-family:var(--mono);font-size:.6rem;line-height:1.5;color:var(--slate)}
.prov b{color:var(--slate);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-right:.4em}
.prov a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue-soft)}
.prov a:hover,.prov a:focus-visible{border-bottom-color:var(--blue)}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(237,241,247,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.nav .in{max-width:680px;margin:0 auto;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.btn{flex:1;font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:3px;padding:12px 0;cursor:pointer;transition:all .12s}
.btn.pri{background:var(--ink);color:#fff}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:default}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.sm{flex:0 0 auto;padding:12px 14px}
.empty{text-align:center;color:var(--slate);font-family:var(--mono);font-size:.75rem;padding:60px 0}
.empty b{display:block;color:var(--ink);font-size:.85rem;margin-bottom:6px}
.empty button{margin-top:14px;font-family:var(--mono);font-size:.7rem;border:1px solid var(--ink);
  background:var(--card);color:var(--ink);border-radius:3px;padding:9px 14px;cursor:pointer}
.empty button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* Visible to screen readers, not to the eye. */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">AWS · Field Deck</div>
    <h1>AWS AI-Native Development Flashcards</h1>
    <p class="sub">The agent platform, the models under it, the frameworks on top, and the coding agents beside it — one idea per card. Tap a card to flip it. @@FRESHNESS@@</p>
    <div class="meta">@@META@@</div>
  </header>

  <div class="chips" id="chips" role="tablist" aria-label="Filter by category"></div>

  <div class="search">
    <label class="sr-only" for="q">Search the deck</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search cards — try &quot;gateway&quot; or &quot;pricing&quot;"
           aria-describedby="qHelp">
    <button class="clear" id="qClear" type="button" aria-label="Clear search" hidden>&times;</button>
  </div>
  <p class="sr-only" id="qHelp">Results are filtered as you type and announced below.</p>
  <div class="tags" id="tags" aria-label="Filter by tag"></div>
  <div class="studyBar">
    <button class="studyToggle" id="studyBtn" type="button" aria-pressed="false">Study mode</button>
    <div class="studyStats" id="studyStats"></div>
  </div>
  <p class="sr-only" id="live" role="status" aria-live="polite"></p>

  <div class="progress"><div class="bar"><i id="barFill"></i></div><div class="count" id="count">1 / @@COUNT@@</div></div>

  <div class="stage" id="stage"></div>
</div>

<nav class="nav"><div class="in">
  <button class="btn sm" id="prevBtn" aria-label="Previous card">‹ Prev</button>
  <button class="btn pri" id="flipBtn">Flip card</button>
  <button class="btn sm" id="shufBtn" aria-label="Shuffle deck">⇄</button>
  <button class="btn sm" id="nextBtn" aria-label="Next card">Next ›</button>
</div></nav>

<script>
/* ---- pictogram library: consistent 1.5px line-art schematic style ---- */
const S = (inner)=>`<svg viewBox="0 0 120 120" fill="none" stroke="#1F5EFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ART = {
platform:S(`<rect x="20" y="20" width="80" height="80" rx="4"/><rect x="34" y="34" width="22" height="22" rx="2"/><rect x="64" y="34" width="22" height="22" rx="2"/><rect x="34" y="64" width="22" height="22" rx="2"/><rect x="64" y="64" width="22" height="22" rx="2"/><path d="M56 45h8M45 56v8M75 56v8M56 75h8" stroke-dasharray="2 3"/><circle cx="60" cy="60" r="4" fill="#1F5EFF" stroke="none"/>`),

memory:S(`<rect x="30" y="24" width="60" height="16" rx="2"/><rect x="30" y="52" width="60" height="16" rx="2"/><rect x="30" y="80" width="60" height="16" rx="2"/><path d="M60 40v12M60 68v12"/><circle cx="40" cy="32" r="2" fill="#1F5EFF" stroke="none"/><circle cx="40" cy="60" r="2" fill="#1F5EFF" stroke="none"/><circle cx="40" cy="88" r="2" fill="#1F5EFF" stroke="none"/><path d="M96 32c8 0 8 56 0 56" stroke-dasharray="3 4"/>`),
gateway:S(`<rect x="48" y="40" width="24" height="40" rx="3"/><path d="M18 46h30M18 60h30M18 74h30"/><circle cx="18" cy="46" r="2.5"/><circle cx="18" cy="60" r="2.5"/><circle cx="18" cy="74" r="2.5"/><path d="M72 60h30"/><path d="M94 52l8 8-8 8"/><path d="M56 50v20M64 50v20" stroke-dasharray="2 3"/>`),
identity:S(`<circle cx="60" cy="44" r="14"/><path d="M36 92c0-14 11-22 24-22s24 8 24 22"/><rect x="72" y="66" width="26" height="20" rx="3" fill="#fff"/><path d="M78 66v-5a7 7 0 0 1 14 0v5"/><circle cx="85" cy="76" r="2.5" fill="#1F5EFF" stroke="none"/>`),
code:S(`<rect x="20" y="26" width="80" height="68" rx="4"/><path d="M42 50l-12 11 12 11M78 50l12 11-12 11M66 46l-12 42"/><path d="M20 26l-4-4M100 26l4-4M20 94l-4 4M100 94l4 4" stroke-dasharray="2 3"/>`),
browser:S(`<rect x="20" y="26" width="80" height="68" rx="4"/><path d="M20 42h80"/><circle cx="29" cy="34" r="2" fill="#1F5EFF" stroke="none"/><circle cx="37" cy="34" r="2" fill="#1F5EFF" stroke="none"/><rect x="30" y="52" width="34" height="30" rx="2" stroke-dasharray="3 3"/><path d="M72 56h18M72 66h18M72 76h12"/><path d="M60 100l6-8 6 4" stroke-width="1.4"/>`),
observe:S(`<path d="M20 84l16-20 14 10 16-28 14 14 12-10" /><circle cx="36" cy="64" r="3"/><circle cx="66" cy="46" r="3"/><circle cx="94" cy="50" r="3"/><path d="M20 92h84M20 92V28" stroke-dasharray="2 4"/><circle cx="84" cy="76" r="12"/><path d="M93 85l8 8"/>`),
policy:S(`<path d="M60 22l32 12v22c0 22-14 36-32 42-18-6-32-20-32-42V34z"/><path d="M46 60h28M46 70h20" /><path d="M50 44l8 8 14-16"/>`),
evals:S(`<rect x="24" y="24" width="72" height="72" rx="4"/><path d="M38 44l7 7 12-14M38 70l7 7 12-14"/><path d="M64 48h22M64 74h22"/><path d="M24 60h-6M102 60h-6" stroke-dasharray="2 3"/>`),
optimize:S(`<path d="M60 22a38 38 0 1 1-27 11"/><path d="M33 33l-2-14 14 2"/><circle cx="60" cy="60" r="16"/><circle cx="60" cy="60" r="6"/><path d="M60 44v-6M76 60h6" stroke-dasharray="2 3"/>`),
registry:S(`<rect x="26" y="22" width="68" height="20" rx="3"/><rect x="26" y="50" width="68" height="20" rx="3"/><rect x="26" y="78" width="68" height="20" rx="3"/><circle cx="36" cy="32" r="3"/><circle cx="36" cy="60" r="3"/><circle cx="36" cy="88" r="3"/><path d="M46 32h32M46 60h32M46 88h22"/><path d="M94 22l8-8" stroke-dasharray="2 3"/>`),
harness:S(`<circle cx="60" cy="60" r="30"/><rect x="50" y="50" width="20" height="20" rx="3"/><path d="M60 30v-10M60 100V90M30 60H20M100 60H90M39 39l-7-7M88 88l-7-7M81 39l7-7M32 88l7-7"/>`),
cli:S(`<rect x="20" y="30" width="80" height="60" rx="4"/><path d="M32 48l12 10-12 10"/><path d="M50 68h20"/><path d="M20 30l80 60" stroke="none"/><circle cx="90" cy="42" r="2" fill="#1F5EFF" stroke="none"/><path d="M78 42h6" />`),
payments:S(`<rect x="22" y="38" width="76" height="46" rx="5"/><path d="M22 52h76"/><rect x="32" y="62" width="18" height="10" rx="2"/><path d="M70 68h18"/><circle cx="98" cy="34" r="12" fill="#fff"/><path d="M98 28v12M94 31h7a3 3 0 0 1 0 6h-6a3 3 0 0 0 0 6h7" stroke-width="1.4"/>`),
pricing:S(`<path d="M60 20v80M40 36h30a12 12 0 0 1 0 24H50a12 12 0 0 0 0 24h34" /><path d="M20 100h80" stroke-dasharray="2 4"/><path d="M20 100c14-26 22-40 40-40" stroke-dasharray="3 3"/>`),
regions:S(`<circle cx="60" cy="60" r="36"/><path d="M60 24c-14 10-14 62 0 72M60 24c14 10 14 62 0 72M26 50h68M26 70h68"/><circle cx="78" cy="76" r="4" fill="#1F5EFF" stroke="none"/>`),
migrate:S(`<rect x="18" y="44" width="30" height="30" rx="3" stroke-dasharray="4 3"/><rect x="72" y="38" width="34" height="42" rx="4"/><path d="M48 59h18"/><path d="M60 51l8 8-8 8"/><path d="M80 50h18M80 60h18M80 70h12"/>`),
map:S(`<circle cx="60" cy="60" r="8"/><rect x="18" y="18" width="24" height="18" rx="2"/><rect x="78" y="18" width="24" height="18" rx="2"/><rect x="18" y="84" width="24" height="18" rx="2"/><rect x="78" y="84" width="24" height="18" rx="2"/><path d="M40 34l14 18M80 34L66 52M40 86l14-18M80 86L66 68" stroke-dasharray="3 3"/>`)
};

/* ---- deck ---- */
/*__CAT__*/
/*__DECK__*/

/* ---- spaced repetition (inlined from src/lib/srs.js at build time) ---- */
/*__SRS__*/

const SRS_KEY='aws-flashcards.progress.v1';
let PROGRESS=emptyProgress();
let studyMode=false;

/* localStorage can throw: private browsing, quota, or a disabled store. A deck
   that cannot save progress must still be readable, so every access is guarded
   and failure degrades to an in-memory session rather than a broken page. */
function loadProgress(){
  try{
    const raw=localStorage.getItem(SRS_KEY);
    PROGRESS=normaliseProgress(raw?JSON.parse(raw):null);
  }catch(e){PROGRESS=emptyProgress();}
}
function saveProgress(){
  try{localStorage.setItem(SRS_KEY,JSON.stringify(PROGRESS));}catch(e){/* session-only */}
}
function today(){return dayStamp(Date.now());}

function renderStudyStats(){
  const c=studyCounts(DECK,PROGRESS,today());
  const el=document.getElementById('studyStats');
  const bits=[];
  if(c.changed)bits.push('<span class="chg">CHANGED <b>'+c.changed+'</b></span>');
  bits.push('<span>NEW <b>'+c.new+'</b></span>');
  bits.push('<span>DUE <b>'+c.due+'</b></span>');
  bits.push('<span>SCHEDULED <b>'+c.scheduled+'</b></span>');
  el.innerHTML=bits.join('');
}

/* Decorate the back face with the grade buttons, the schedule hint and — when
   the card's facts have moved since it was last studied — a warning that the
   thing they memorised is no longer what the card says. */
function decorateForStudy(d){
  const body=document.querySelector('.back .body');
  if(!body)return;
  const st=cardStatus(d,PROGRESS,today());

  if(st.reason===REASON.changed){
    const warn=document.createElement('div');
    warn.className='changed';
    warn.innerHTML='<b>Changed since you studied it</b>A deterministic source corrected this card. What you memorised is out of date \u2014 read it again.';
    body.insertBefore(warn,body.firstChild);
  }

  const sched=document.createElement('p');
  sched.className='sched';
  sched.textContent=describeSchedule(d,PROGRESS,today());
  body.appendChild(sched);

  if(!studyMode)return;
  const wrap=document.createElement('div');
  wrap.className='grades';
  wrap.setAttribute('role','group');
  wrap.setAttribute('aria-label','How well did you recall this card?');
  const opts=[['again','Again','g0','1'],['hard','Hard','g3','2'],['good','Good','g4','3'],['easy','Easy','g5','4']];
  for(const [key,label,cls,num] of opts){
    const b=document.createElement('button');
    b.type='button';b.className=cls;b.dataset.grade=key;
    b.innerHTML=label+'<i>'+num+'</i>';
    b.onclick=e=>{e.stopPropagation();grade(key);};
    wrap.appendChild(b);
  }
  body.appendChild(wrap);
}

function grade(key){
  const v=visible();
  if(!v.length)return;
  const d=DECK[v[pos]];
  const g=GRADES[key];
  if(g===undefined)return;
  PROGRESS.reviews[d.id]=review(PROGRESS.reviews[d.id],g,today(),d.chash);
  saveProgress();
  renderStudyStats();
  /* The card just left the queue, so pos now points at whatever moved up.
     Staying put is right: it is the next card to study. */
  flipped=false;
  const remaining=visible().length;
  if(pos>=remaining)pos=Math.max(0,remaining-1);
  announce(d.id+' graded '+key+'. '+remaining+' card'+(remaining===1?'':'s')+' left in the queue.');
  render();
}

function setStudyMode(on){
  studyMode=on;
  const b=document.getElementById('studyBtn');
  b.setAttribute('aria-pressed',on?'true':'false');
  pos=0;flipped=false;
  render();
  const c=studyCounts(DECK,PROGRESS,today());
  announce(on
    ?'Study mode on. '+c.total+' card'+(c.total===1?'':'s')+' to review'+(c.changed?', '+c.changed+' changed since you studied them':'')+'.'
    :'Study mode off, browsing all cards.');
}

/* ---- state & render ---- */
let filter=-1, tag=null, query='', order=DECK.map((_,i)=>i), pos=0, flipped=false;
const stage=document.getElementById('stage');

function tokenise(q){return q.toLowerCase().split(/\s+/).filter(Boolean);}

/* Every token must appear somewhere (AND, not OR). With a few hundred cards an
   OR search returns the whole deck, which is worse than no search at all. */
function scoreCard(d,tokens){
  if(!tokens.length)return 1;
  const title=d.t.toLowerCase(), tags=(d.tags||[]).join(' ').toLowerCase(), hook=d.hook.toLowerCase();
  let score=0;
  for(const tok of tokens){
    if(!d.search.includes(tok))return 0;
    if(d.id.toLowerCase()===tok)score+=10;
    if(title.includes(tok))score+=4;
    if(tags.includes(tok))score+=3;
    if(hook.includes(tok))score+=2;
    score+=1;
  }
  return score;
}

function visible(){
  const tokens=tokenise(query);
  const scored=[];
  for(const i of order){
    const d=DECK[i];
    if(filter>=0&&d.c!==filter)continue;
    if(tag&&!(d.tags||[]).includes(tag))continue;
    const sc=scoreCard(d,tokens);
    if(!sc)continue;
    scored.push([i,sc]);
  }
  /* Rank only when searching: a learner working through a category expects a
     stable sequence, not one that reorders under them. */
  if(tokens.length)scored.sort((a,b)=>b[1]-a[1]||a[0]-b[0]);
  /* Study mode reorders whatever the filters admitted into review priority:
     corrected cards first, then unseen, then most-overdue. */
  if(studyMode){
    const allowed=new Set(scored.map(x=>x[0]));
    return studyQueue(DECK.filter((_,i)=>allowed.has(i)),PROGRESS,today()).map(q=>DECK.indexOf(q.card));
  }
  return scored.map(x=>x[0]);
}

function slugify(s){return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

/* Resolve a URL ref by slug OR by any alias the card has ever had, so a link
   shared long ago still lands on the right card after a rename. */
function resolveRef(ref){
  const want=slugify(ref);
  let i=DECK.findIndex(d=>d.slug===want);
  if(i>=0)return i;
  return DECK.findIndex(d=>(d.aliases||[]).some(a=>slugify(a)===want));
}

/* The card template is injected here at build time from
   content/card-template.html, so the runtime render and the deck.json faces come
   from ONE source. It used to be inlined twice, which silently drifted: the
   aria-hidden fix and the provenance footer reached deck.json but never the page. */
/*__TEMPLATE_FN__*/

function render(){
  const v=visible();
  const total=v.length;
  document.getElementById('count').textContent=total?`${pos+1} / ${total}`:'0 / 0';
  document.getElementById('barFill').style.width=total?((pos+1)/total*100)+'%':'0%';
  document.getElementById('prevBtn').disabled=pos===0;
  document.getElementById('nextBtn').disabled=pos>=total-1;
  if(!total){
    stage.innerHTML='<div class="empty"><b>'+(studyMode?'Nothing left to review.':'No cards match.')+'</b>'+
      escapeHtml(studyMode?'Everything in scope is scheduled for a future date.':describeFilters())+
      '<br><button type="button" id="resetBtn">'+(studyMode?'Browse all cards':'Clear filters')+'</button></div>';
    const r=document.getElementById('resetBtn');
    if(r)r.onclick=()=>{
      if(studyMode){setStudyMode(false);return;}
      filter=-1;tag=null;query='';document.getElementById('q').value='';syncControls();pos=0;flipped=false;render();
    };
    announce(studyMode?'Nothing left to review.':'No cards match. '+describeFilters());
    syncHash();
    return;
  }
  const d=DECK[v[pos]];
  stage.innerHTML=renderCard(d,flipped,CAT,ART);
  const card=document.getElementById('card');
  card.addEventListener('click',flip);
  card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
  decorateForStudy(d);
  fitCard();
  syncHash();
}

function describeFilters(){
  const bits=[];
  if(query)bits.push('search "'+query+'"');
  if(tag)bits.push('tag "'+tag+'"');
  if(filter>=0)bits.push('category "'+CAT[filter]+'"');
  return bits.length?'Active: '+bits.join(', ')+'.':'';
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* A visual count change is invisible to a screen reader, so say it out loud. */
let announceTimer=null;
function announce(msg){
  clearTimeout(announceTimer);
  announceTimer=setTimeout(()=>{document.getElementById('live').textContent=msg;},250);
}
/* Size the card to its tallest face.
   The two faces are absolutely positioned so they can stack for the 3D flip,
   which means the container needs an explicit height — and a fixed 520px clipped
   the longest backs once the provenance footer was added. Measuring beats
   guessing a number that goes stale as cards grow. */
function fitCard(){
  const c=document.getElementById('card');if(!c)return;
  const body=c.querySelector('.back .body'), strip=c.querySelector('.back .strip');
  if(!body)return;
  const needed=Math.max(520,(strip?strip.offsetHeight:0)+body.scrollHeight+2);
  c.style.minHeight=needed+'px';
  stage.style.minHeight=needed+'px';
}
addEventListener('resize',fitCard);
/* Keep assistive technology in step with the 3D flip.
   backface-visibility hides the reverse face from SIGHT only — a screen reader
   still reads both, so it would announce the answer while the question shows.
   aria-hidden fixes what is READ; `inert` fixes what is REACHABLE. Without it a
   keyboard user can Tab into the invisible face and hit a grade button — or a
   provenance link — on a side they have not seen. Focusable content inside
   aria-hidden is also an accessibility violation in its own right. */
function applyFaceState(){
  const c=document.getElementById('card');if(!c)return;
  c.classList.toggle('flipped',flipped);
  const front=c.querySelector('.face.front'), back=c.querySelector('.face.back');
  if(front){front.setAttribute('aria-hidden',flipped?'true':'false');front.inert=flipped;}
  if(back){back.setAttribute('aria-hidden',flipped?'false':'true');back.inert=!flipped;}
  const v=visible();
  const d=v.length?DECK[v[pos]]:null;
  if(d){
    c.setAttribute('aria-pressed',flipped?'true':'false');
    c.setAttribute('aria-label','Flashcard: '+d.t+'. '+(flipped
      ?'Showing detail. Press to show the question.'
      :'Showing the question. Press to reveal detail.'));
  }
}
function flip(){flipped=!flipped;applyFaceState();}
function go(d){const t=visible().length;const n=Math.min(Math.max(pos+d,0),t-1);if(n!==pos){pos=n;flipped=false;render();}}
function shuffle(){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}pos=0;flipped=false;render();}

/* chips */
const chipsEl=document.getElementById('chips');
["All",...CAT].forEach((label,i)=>{
  const b=document.createElement('button');
  b.className='chip';b.textContent=label;b.setAttribute('role','tab');b.dataset.cat=String(i-1);
  b.onclick=()=>{filter=i-1;pos=0;flipped=false;syncControls();render();};
  chipsEl.appendChild(b);
});

/* tags — derived from the cards, so the taxonomy cannot drift from the content */
const TAGS=(()=>{
  const counts=new Map();
  for(const d of DECK)for(const t of (d.tags||[]))counts.set(t,(counts.get(t)||0)+1);
  return [...counts.entries()].map(([tag,count])=>({tag,count}))
    .sort((a,b)=>b.count-a.count||a.tag.localeCompare(b.tag));
})();
const TAGS_SHOWN=12;
let tagsExpanded=false;
const tagsEl=document.getElementById('tags');
function renderTags(){
  tagsEl.innerHTML='';
  const list=tagsExpanded?TAGS:TAGS.slice(0,TAGS_SHOWN);
  for(const {tag:t,count} of list){
    const b=document.createElement('button');
    b.type='button';b.className='tag'+(tag===t?' on':'');
    b.setAttribute('aria-pressed',tag===t?'true':'false');
    b.innerHTML=escapeHtml(t)+'<i>'+count+'</i>';
    b.onclick=()=>{tag=(tag===t?null:t);pos=0;flipped=false;syncControls();render();};
    tagsEl.appendChild(b);
  }
  if(TAGS.length>TAGS_SHOWN){
    const m=document.createElement('button');
    m.type='button';m.className='tagsMore';
    m.textContent=tagsExpanded?'show fewer tags':'+'+(TAGS.length-TAGS_SHOWN)+' more tags';
    m.setAttribute('aria-expanded',tagsExpanded?'true':'false');
    m.onclick=()=>{tagsExpanded=!tagsExpanded;renderTags();};
    tagsEl.appendChild(m);
  }
}

/* Reflect state back into the controls. Called after any state change so the
   controls, the URL and the deck can never disagree about what is filtered. */
function syncControls(){
  chipsEl.querySelectorAll('.chip').forEach(x=>{
    const on=Number(x.dataset.cat)===filter;
    x.classList.toggle('on',on);
    x.setAttribute('aria-selected',on?'true':'false');
  });
  const qi=document.getElementById('q');
  if(qi.value!==query)qi.value=query;
  document.getElementById('qClear').hidden=!query;
  renderTags();
}

/* ---- URL as shareable state (deep links) ----
   Position is expressed as a card SLUG, never an index: an index would silently
   point at a different card as soon as the deck grows or is shuffled, which is
   the fastest way to make shared links quietly wrong. */
let suppressHash=false;
function syncHash(){
  const v=visible();
  const d=v.length?DECK[v[pos]]:null;
  const params=new URLSearchParams();
  if(filter>=0)params.set('cat',slugify(CAT[filter]));
  if(tag)params.set('tag',tag);
  if(query)params.set('q',query);
  const qs=params.toString();
  const next='#'+(d?'/card/'+d.slug:'/')+(qs?'?'+qs:'');
  if(location.hash===next)return;
  suppressHash=true;
  history.replaceState(null,'',next);
  setTimeout(()=>{suppressHash=false;},0);
}

/* Unknown categories, tags and card refs are ignored rather than throwing: a
   stale or hand-edited link should degrade to the full deck, not a blank page. */
function applyHash(){
  const raw=(location.hash||'').replace(/^#/,'');
  const [path,qs]=raw.split('?');
  const params=new URLSearchParams(qs||'');
  const cat=params.get('cat');
  filter=cat?CAT.findIndex(c=>slugify(c)===cat):-1;
  const t=params.get('tag');
  tag=(t&&DECK.some(d=>(d.tags||[]).includes(t)))?t:null;
  query=params.get('q')||'';
  flipped=false;pos=0;
  const m=/^\/card\/(.+)$/.exec(path||'');
  if(m){
    const idx=resolveRef(m[1]);
    if(idx>=0){
      let v=visible();
      /* The link named a card, so if the filters it carries would hide that
         card, the filters lose. */
      if(v.indexOf(idx)<0){filter=-1;tag=null;query='';v=visible();}
      const at=v.indexOf(idx);
      if(at>=0)pos=at;
    }
  }
  syncControls();
  render();
}
addEventListener('hashchange',()=>{if(!suppressHash)applyHash();});

/* search — debounced so typing does not re-render on every keystroke */
let qTimer=null;
const qInput=document.getElementById('q');
qInput.addEventListener('input',()=>{
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>{
    query=qInput.value.trim();
    pos=0;flipped=false;
    document.getElementById('qClear').hidden=!query;
    render();
    const n=visible().length;
    announce(query?n+(n===1?' card matches ':' cards match ')+'"'+query+'"':'Search cleared, '+n+' cards');
  },160);
});
qInput.addEventListener('keydown',e=>{
  if(e.key==='Escape'){qInput.value='';query='';pos=0;flipped=false;syncControls();render();}
});
document.getElementById('qClear').onclick=()=>{
  qInput.value='';query='';pos=0;flipped=false;syncControls();render();qInput.focus();
};

document.getElementById('prevBtn').onclick=()=>go(-1);
document.getElementById('nextBtn').onclick=()=>go(1);
document.getElementById('flipBtn').onclick=flip;
document.getElementById('shufBtn').onclick=shuffle;
document.getElementById('studyBtn').onclick=()=>setStudyMode(!studyMode);
document.addEventListener('keydown',e=>{
  /* Don't hijack the keyboard while the user is typing — arrow keys belong to
     the text field, and "/" should reach it rather than being swallowed. */
  const t=e.target;
  const typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
  if(typing)return;
  if(e.key==='/'){e.preventDefault();qInput.focus();qInput.select();return;}
  if(e.key==='s'||e.key==='S'){setStudyMode(!studyMode);return;}
  /* Grade with 1-4, but only once the answer is showing — grading a card you
     have not read is meaningless, and the keys are free otherwise. */
  if(studyMode&&flipped&&['1','2','3','4'].includes(e.key)){
    e.preventDefault();
    grade(['again','hard','good','easy'][Number(e.key)-1]);
    return;
  }
  if(e.key==='ArrowLeft')go(-1);
  if(e.key==='ArrowRight')go(1);
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();flip();}
});
/* Start from the URL, not from a blank slate: a shared deep link must land on
   the card it names on first load, not after an interaction. */
loadProgress();
renderStudyStats();
applyHash();
</script>
</body>
</html>
