<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentCore Field Deck — 21 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F7;
  --card:#FFFFFF;
  --ink:#0E1B2C;
  --slate:#55637A;
  --line:#D4DCE8;
  --blue:#1F5EFF;
  --blue-soft:#E8EEFF;
  --amber:#B36B00;
  --amber-soft:#FFF3DC;
  --mint:#0B7A54;
  --mint-soft:#E2F5EC;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 90px}

/* ---------- header ---------- */
header{margin-bottom:14px}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600}
h1{font-family:var(--disp);font-weight:700;font-size:1.65rem;line-height:1.15;margin:.2rem 0 .3rem}
.sub{color:var(--slate);font-size:.86rem;max-width:46ch}
.meta{font-family:var(--mono);font-size:.66rem;color:var(--slate);margin-top:.5rem;display:flex;gap:.9rem;flex-wrap:wrap}
.meta b{color:var(--ink)}

/* ---------- filters ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-family:var(--mono);font-size:.7rem;font-weight:500;white-space:nowrap;border:1px solid var(--line);
  background:var(--card);color:var(--slate);border-radius:3px;padding:7px 12px;cursor:pointer;transition:all .15s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- progress ---------- */
.progress{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.count{font-family:var(--mono);font-size:.7rem;color:var(--slate);min-width:64px;text-align:right}

/* ---------- card ---------- */
.stage{perspective:1600px;min-height:520px}
.cardShell{position:relative;width:100%;min-height:520px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.cardShell.flipped{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){
  .cardShell{transition:none}
  .bar i{transition:none}
}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 1px 2px rgba(14,27,44,.05),0 10px 28px rgba(14,27,44,.08);
  display:flex;flex-direction:column;overflow:hidden}
.back{transform:rotateY(180deg)}

/* datasheet header strip */
.strip{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 16px;font-family:var(--mono);font-size:.64rem;letter-spacing:.08em}
.partno{color:var(--blue);font-weight:600}
.badge{padding:2px 8px;border-radius:2px;font-weight:600;text-transform:uppercase}
.badge.ga{background:var(--mint-soft);color:var(--mint)}
.badge.pv{background:var(--amber-soft);color:var(--amber)}
.badge.core{background:var(--blue-soft);color:var(--blue)}

/* front */
.front .art{display:flex;justify-content:center;padding:26px 0 8px}
.front .art svg{width:150px;height:150px}
.front h2{font-family:var(--disp);font-weight:700;font-size:1.5rem;text-align:center;padding:4px 20px 0;line-height:1.2}
.front .hook{color:var(--slate);text-align:center;font-size:.88rem;padding:8px 26px 0;max-width:44ch;margin:0 auto}
.front .tap{margin-top:auto;text-align:center;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--slate);padding:16px;text-transform:uppercase}
.front .tap::before{content:"";display:block;width:26px;height:1px;background:var(--line);margin:0 auto 10px}

/* back */
.back .body{padding:16px 18px 18px;overflow-y:auto;font-size:.85rem}
.back h3{font-family:var(--disp);font-size:1.05rem;margin-bottom:8px}
.back p{margin-bottom:10px;color:#22314A}
.kv{border-top:1px dashed var(--line);margin-top:4px;padding-top:10px}
.kv .row{display:flex;gap:10px;margin-bottom:8px}
.kv .k{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);min-width:86px;padding-top:2px;font-weight:600}
.kv .v{flex:1;color:#22314A}
.hookline{background:var(--blue-soft);border-left:2px solid var(--blue);padding:8px 10px;border-radius:0 3px 3px 0;font-size:.8rem;margin-top:6px}
.hookline b{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);display:block;margin-bottom:2px}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(237,241,247,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.nav .in{max-width:680px;margin:0 auto;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.btn{flex:1;font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:3px;padding:12px 0;cursor:pointer;transition:all .12s}
.btn.pri{background:var(--ink);color:#fff}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:default}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.sm{flex:0 0 auto;padding:12px 14px}
.empty{text-align:center;color:var(--slate);font-family:var(--mono);font-size:.75rem;padding:60px 0}
</style>
</head>

  <header>
    <div class="eyebrow">Amazon Bedrock · Field Deck</div>

<nav class="nav"><div class="in">

</div></nav>

const CAT = ["Foundations","Core services","Built-in tools","Governance & quality","New in 2026","Operate & adopt"];
const DECK = [
{c:0,id:"AC-01",b:"ga",bt:"GA OCT 2025",art:"platform",t:"What is AgentCore?",hook:"AWS's agentic platform: build, deploy, and operate agents at scale — any framework, any model.",
back:{lead:"Amazon Bedrock AgentCore is a fully managed platform for running AI agents in production. You bring the agent code; AgentCore supplies infrastructure, session isolation, memory, tool connectivity, identity, governance, and monitoring — with no servers to manage.",
kv:[["Agnostic","Works with any framework (Strands, LangGraph, CrewAI, LlamaIndex) and any model — Bedrock-hosted or not (incl. Anthropic API)."],
["GA","Preview Jul 16 2025 → generally available Oct 13 2025, with VPC, PrivateLink, CloudFormation, and tagging support."],

{c:0,id:"AC-02",b:"core",bt:"ARCHITECTURE",art:"modular",t:"Modular by design",hook:"Nine-plus composable services. Use one, some, or all — nothing forces a full-stack commitment.",
back:{lead:"AgentCore is a kit of independent services: Runtime, Memory, Gateway, Identity, Code Interpreter, Browser, Observability, plus the newer Policy, Evaluations, and Registry. Each has its own API and pricing; they interoperate but never require each other.",
kv:[["Mix freely","E.g. run agents on your own compute but use only Gateway for tool access, or only Memory for context."],
["Enterprise","All services support VPC connectivity and PrivateLink for private-network access."],
["Why it matters","You can adopt incrementally — wrap an existing local agent loop with one AgentCore service at a time."]],
hookline:"Think 'LEGO for agent infrastructure', not a monolithic agent product."}},

{c:0,id:"AC-03",b:"core",bt:"PROTOCOLS",art:"protocol",t:"MCP & A2A support",hook:"Standard protocols glue it together: MCP for tools, Agent-to-Agent for inter-agent calls.",
back:{lead:"AgentCore leans on open protocols rather than proprietary interfaces. Gateway speaks Model Context Protocol so any MCP-compatible agent can discover and call tools; Runtime added Agent-to-Agent (A2A) support at GA so agents can invoke each other directly.",
kv:[["MCP","Gateway exposes tools over MCP and can also proxy to your existing MCP servers."],
["A2A","Enables multi-agent systems: delegation, sub-agents, and agent-as-tool patterns across Runtime deployments."],
["Dev tooling","An open-source AgentCore MCP Server lets coding assistants (Claude Code, Kiro, Q Developer) drive AgentCore itself."]],
hookline:"Protocol-first design is why 'any framework' is credible — the contract is MCP/A2A, not an SDK lock-in."}},

{c:1,id:"AC-04",b:"core",bt:"CORE SERVICE",art:"runtime",t:"AgentCore Runtime",hook:"Serverless agent hosting: one isolated microVM per session, executions up to 8 hours.",
back:{lead:"Runtime hosts your agent (or tool) code. Every session gets a dedicated microVM with full session isolation, so one user's context can never leak into another's. It auto-scales, needs zero infrastructure management, and supports long-running work up to eight hours.",
kv:[["Deploy","Container-based (ECR) or direct code deployment (artifacts in S3). Framework-agnostic entry point."],
["Isolation","MicroVM per session — filesystem, memory, and compute are per-user, then destroyed."],
["Long tasks","8-hour execution window is industry-leading; built for deep research, pipelines, and headless loops."],
["Billing","Pay only for active CPU/memory consumption — not for time spent waiting on LLM or API I/O."]],
hookline:"Runtime = 'Lambda for agents', but with sessions, statefulness, and hours-long lifetimes."}},

{c:1,id:"AC-05",b:"core",bt:"CORE SERVICE",art:"memory",t:"AgentCore Memory",hook:"Managed short-term and long-term memory so agents remember across turns — and across sessions.",
back:{lead:"Memory gives agents managed recall. Short-term memory captures raw session events (the conversation as it happens). Long-term memory runs extraction strategies over those events to distill durable knowledge that persists across sessions.",
kv:[["Strategies","Built-in: semantic facts, summaries, and user preferences. A self-managed strategy (GA) lets you run your own extraction/consolidation pipeline."],
["Episodic","Added at re:Invent 2025: per-user episodic memory for personal preferences (seat choice, budget caps, style)."],
["Streaming","Memory streaming (2026) reduces the lag between an event happening and it becoming retrievable."],
["Pricing","Consumption-based; short-term events billed per volume (launched around $0.25 per 1,000 events)."]],
hookline:"Short-term = the transcript. Long-term = what a good assistant would write in their notebook afterwards."}},

{c:1,id:"AC-06",b:"core",bt:"CORE SERVICE",art:"gateway",t:"AgentCore Gateway",hook:"Turns your APIs, Lambda functions, and MCP servers into one governed tool endpoint for agents.",
back:{lead:"Gateway is the tool integration layer. It transforms existing REST APIs (OpenAPI specs), Lambda functions, and AWS services into MCP-compatible tools, and can also front your existing MCP servers — giving agents a single secure endpoint for tool discovery and invocation.",
kv:[["No rewrites","Wrap what you already have; Gateway handles protocol translation, credentials, and error normalization."],
["Auth","Supports both IAM (SigV4) and OAuth authorization for agent→tool calls."],
["Tool overload","Runtime tool discovery + semantic search means agents aren't handed hundreds of tools at once, which degrades tool selection."],
["Governance","Gateway is where Policy intercepts every tool call (see AC-11)."]],
hookline:"Gateway is the choke point — one endpoint for all tools means one place to authenticate, observe, and enforce policy."}},

{c:1,id:"AC-07",b:"core",bt:"CORE SERVICE",art:"identity",t:"AgentCore Identity",hook:"Auth built for non-human identities: agents acting as themselves or on a user's behalf.",
back:{lead:"Identity handles authentication, authorization, and credential management for agents. It covers inbound auth (who may invoke the agent) and outbound auth (what the agent may access), with a secure token vault for refresh tokens.",

["Mechanisms","OAuth 2.0 flows, API keys, and AWS SigV4."],
["Delegation","Agents can act on behalf of users with pre-authorized consent, or autonomously with their own identity — to services like GitHub, Slack, Salesforce."],
["GA adds","Identity-aware authorization and vault storage for refresh tokens."]],

{c:2,id:"AC-08",b:"core",bt:"BUILT-IN TOOL",art:"code",t:"Code Interpreter",hook:"A sandboxed environment where agents write and execute code — Python, JavaScript, TypeScript.",
back:{lead:"Code Interpreter gives agents an isolated sandbox to write, run, and debug code. This dramatically improves accuracy on math, data analysis, and file transformation tasks, because the agent computes answers instead of guessing them.",

["Languages","Python, JavaScript, and TypeScript at launch."],
["Billing","Per-second, based on active CPU/memory — you don't pay while the sandbox idles waiting on the model."],
["Use cases","Data analysis, chart generation, file conversion, validation logic, agent 'self-checks'."]],

{c:2,id:"AC-09",b:"core",bt:"BUILT-IN TOOL",art:"browser",t:"Browser tool",hook:"A managed cloud browser so agents can navigate sites, fill forms, and finish web tasks.",
back:{lead:"The Browser tool provides fast, secure, cloud-hosted browser sessions that agents drive to interact with real web applications — navigation, form-filling, and multi-step web workflows — with sub-second latency and session isolation.",
kv:[["Isolation","VM-level isolation per session plus audit-friendly recording of what the agent did."],
["Profiles","Browser profiles persist cookies/local storage between sessions (stored in S3, billed at S3 rates from Apr 2026) — so agents stay logged in."],
["When to use","Sites without APIs, legacy portals, and end-to-end tasks where the web UI is the only interface."]],
hookline:"API when you can, browser when you must — this is the 'when you must' escape hatch, fully managed."}},

{c:1,id:"AC-10",b:"core",bt:"CORE SERVICE",art:"observe",t:"Observability",hook:"OpenTelemetry-based tracing of every reasoning step, tool call, and token an agent spends.",
back:{lead:"Observability gives step-by-step visibility into agent execution: reasoning traces, tool invocations, latency, errors, and token/cost metrics — end to end across all AgentCore services, surfaced through CloudWatch and OTEL-compatible backends.",
kv:[["Trajectories","Inspect full session trajectories with metadata tagging, custom scoring, and debug filters."],
["Standards","Built on OpenTelemetry, so traces flow into your existing observability stack, not a walled garden."],
["Why special","Traditional APM sees latency and errors; agent observability must also answer 'did it pick the right tool and why?'"]],
hookline:"You can't govern or improve what you can't see — Observability is the raw data feed for Evaluations."}},

/* ---- state & render ---- */
let filter=-1, order=DECK.map((_,i)=>i), pos=0, flipped=false;
const stage=document.getElementById('stage');

function visible(){return filter<0?order:order.filter(i=>DECK[i].c===filter);}

function render(){
  const v=visible();
  const total=v.length;
  document.getElementById('count').textContent=total?`${pos+1} / ${total}`:'0 / 0';
  document.getElementById('barFill').style.width=total?((pos+1)/total*100)+'%':'0%';
  document.getElementById('prevBtn').disabled=pos===0;
  document.getElementById('nextBtn').disabled=pos>=total-1;
  if(!total){stage.innerHTML='<div class="empty">No cards in this filter.</div>';return;}
  const d=DECK[v[pos]];
  stage.innerHTML=`
  <div class="cardShell ${flipped?'flipped':''}" id="card" role="button" tabindex="0" aria-label="Flashcard: ${d.t}. Press to flip.">
    <div class="face front">
      <div class="strip"><span class="partno">${d.id} · ${CAT[d.c].toUpperCase()}</span><span class="badge ${d.b}">${d.bt}</span></div>
      <div class="art">${ART[d.art]}</div>
      <h2>${d.t}</h2>
      <p class="hook">${d.hook}</p>
      <div class="tap">Tap to flip</div>
    </div>
    <div class="face back">
      <div class="strip"><span class="partno">${d.id} · DETAIL</span><span class="badge ${d.b}">${d.bt}</span></div>
      <div class="body">
        <h3>${d.t}</h3>
        <p>${d.back.lead}</p>
        <div class="kv">${d.back.kv.map(r=>`<div class="row"><div class="k">${r[0]}</div><div class="v">${r[1]}</div></div>`).join('')}</div>
        <div class="hookline"><b>Memory hook</b>${d.back.hookline}</div>
      </div>
    </div>
  </div>`;
  const card=document.getElementById('card');
  card.addEventListener('click',flip);
  card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
}
function flip(){flipped=!flipped;const c=document.getElementById('card');if(c)c.classList.toggle('flipped',flipped);}
function go(d){const t=visible().length;const n=Math.min(Math.max(pos+d,0),t-1);if(n!==pos){pos=n;flipped=false;render();}}
function shuffle(){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}pos=0;flipped=false;render();}

/* chips */
const chipsEl=document.getElementById('chips');
["All",...CAT].forEach((label,i)=>{
  const b=document.createElement('button');
  b.className='chip'+(i===0?' on':'');b.textContent=label;b.setAttribute('role','tab');
  b.onclick=()=>{filter=i-1;pos=0;flipped=false;
    chipsEl.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();};
  chipsEl.appendChild(b);
});

document.getElementById('prevBtn').onclick=()=>go(-1);
document.getElementById('nextBtn').onclick=()=>go(1);
document.getElementById('flipBtn').onclick=flip;
document.getElementById('shufBtn').onclick=shuffle;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(-1);
  if(e.key==='ArrowRight')go(1);
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();flip();}
});
render();
</script>
